pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.*"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx,js}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    gitleaks:
      run: |
        if command -v gitleaks > /dev/null 2>&1; then
          gitleaks protect --staged
        else
          echo "warning: gitleaks not installed, skipping secret scan. See https://github.com/gitleaks/gitleaks#installation"
        fi
    cargofmt:
      glob: "contracts/**/*.rs"
      run: cargo fmt --{staged_files}
      stage_fixed: true
