# Corridor #1 (TEMPLATE) — USD → Mexico (MXN) via a SEP-31 receiving anchor.
#
# EVERY ENDPOINT BELOW IS FICTIONAL. `anchor.example.mx` does not resolve and is
# not intended to. This file exists to show the SHAPE of a Mexico lane, not to
# describe one that exists — no anchor relationship stands behind it.
#
# It therefore reports UNVERIFIED from `corridor plan` and renders amber on the
# dashboard, because `dest.endpoints.endpoints_verified_at` is deliberately
# unset. To turn this into a real corridor: agree terms with an anchor, read the
# live values out of its published stellar.toml (TRANSFER_SERVER_SEP0031,
# WEB_AUTH_ENDPOINT, KYC_SERVER, ANCHOR_QUOTE_SERVER), replace the URLs, and set
# endpoints_verified_at to the date you checked. Nothing else in this file changes.
#
# The manifest is named generically on purpose. Naming a specific company on a
# file full of invented endpoints implies a relationship that does not exist.
id: mx-example
status_note: "TEMPLATE — endpoints are fictional placeholders. No anchor relationship exists. Not runnable."

source:
  name: USD Sending Anchor
  asset: USDC
  endpoints:
    home_domain: sending-anchor.example

dest:
  name: Mexico Off-Ramp (example — not a real anchor)
  asset: "iso4217:MXN"
  endpoints:
    home_domain: anchor.example.mx # ← FICTIONAL. Replace with a real anchor home domain.
    transfer_server_sep31: https://anchor.example.mx/sep31
    web_auth: https://anchor.example.mx/auth
    kyc_server: https://anchor.example.mx/sep12
    quote_server: https://anchor.example.mx/sep38

fx:
  path: ["USD", "USDC", "MXN"]
  quote_source: sep38
  who_holds_risk: receiving_anchor
  quote_ttl_seconds: 60

compliance:
  source_jurisdiction: US
  dest_jurisdiction: MX
  travel_rule_profile: default

settlement:
  bridge_asset: USDC
  network: public
  asset_issuer: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN # USDC mainnet issuer

recovery:
  max_retries: 3
  timeout_seconds: 900
  rollback: refund_sender
