# Runs a WHOLE corridor — quote → comply → open → settle → reconcile →
# completed — against the Anchor Platform reference stack we stand up
# ourselves, so "the corridor works end to end" is re-checked on a schedule
# rather than being a claim someone made once.
#
# Deliberately separate from nightly-live-anchor.yml: that job probes a real
# third-party anchor read-only, this one owns both ends and settles. It is slow
# (the stack takes minutes to come up), so it runs on its own schedule and by
# hand, never on push.
name: reference-corridor
on:
  workflow_dispatch:
  schedule:
    # Offset from nightly-live-anchor (04:17) so the two never contend.
    - cron: "43 5 * * *"

jobs:
  corridor:
    runs-on: ubuntu-latest
    # The stack is minutes to boot and the corridor waits on the observer's own
    # cadence, but a hung container must not burn an hour of runner time.
    timeout-minutes: 30
    # Job-level, deliberately. The `secrets` context is NOT available in a
    # step-level `if:` — using it there is not a no-op, it makes the whole
    # workflow file invalid, and GitHub then fails every run at 0s without ever
    # starting a step. Same fix as nightly-live-anchor.yml and attest-anchors.yml.
    env:
      SIGNER_SECRET: ${{ secrets.CORRIDOR_SIGNER_SECRET }}
      # The corridor this job runs. Asserted to be testnet below before
      # anything is signed.
      MANIFEST: corridors/reference.corridor.yaml
      # Never set. The runners' mainnet guard is the backstop; this is the
      # first line, and it is here so a future edit to this file has to
      # remove it deliberately rather than merely forget it.
      CORRIDOR_ALLOW_MAINNET: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- guards, before anything is stood up or signed -------------------

      # Testnet only. Parsed with the repo's own manifest loader rather than
      # grepped, so a restructured YAML cannot slip a mainnet corridor past a
      # pattern match.
      - name: Refuse a non-testnet corridor
        run: pnpm exec tsx scripts/assert-testnet-corridor.ts "$MANIFEST"

      # Until the two commands below exist (#40, #41), a run must say which one
      # is missing rather than failing somewhere inside a container it took
      # four minutes to start.
      - name: Check the corridor runner's prerequisites
        run: |
          set -euo pipefail
          missing=""
          grep -q 'doctor)' scripts/reference-anchor.sh \
            || missing="$missing scripts/reference-anchor.sh#doctor(#40)"
          node -e 'process.exit(require("./package.json").scripts["verify:corridor"] ? 0 : 1)' \
            || missing="$missing pnpm-verify:corridor(#41)"
          if [ -n "$missing" ]; then
            echo "::error::this job needs, and cannot find:$missing"
            exit 1
          fi

      - name: Fail early without a signing key
        if: ${{ env.SIGNER_SECRET == '' }}
        run: |
          echo "::error::CORRIDOR_SIGNER_SECRET is not set. A full corridor settles on" \
               "testnet and cannot run unsigned — set the repository secret to a funded" \
               "testnet seed."
          exit 1

      # --- the run ---------------------------------------------------------

      - name: Stand up the reference anchor
        run: scripts/reference-anchor.sh up
        env:
          # Podman ships on the ubuntu-latest image, and the script's container
          # wiring (network aliases the platform's test profile hardcodes) is
          # written against it. Porting those steps to Docker would fork that
          # wiring in two places and let CI and a contributor's laptop drift —
          # the thing this job exists to prevent.
          READY_TIMEOUT_SECS: "600"

      - name: Health gate
        run: scripts/reference-anchor.sh doctor

      - name: Run the corridor to completed
        run: pnpm verify:corridor
        env:
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      # --- evidence and cleanup -------------------------------------------

      - name: Collect platform logs
        if: ${{ failure() }}
        run: scripts/reference-anchor.sh logs-dump anchor-logs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: reference-anchor-logs-${{ github.run_id }}
          path: anchor-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: ${{ always() }}
        run: scripts/reference-anchor.sh down
