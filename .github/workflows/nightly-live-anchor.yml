# Re-runs the opt-in live-anchor probe (tests/integration/sep31-live.test.ts)
# nightly so the "verified against a real anchor" claim is continuously
# checked, not a one-off capture. Safe to ship before any anchor is
# configured: the test self-skips (describe.skipIf) when the ANCHOR_* secrets
# below are unset, so this job goes green-but-skipped until repo secrets are
# added — no code change needed when that day comes.
name: nightly-live-anchor
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    # Job-level, deliberately. The `secrets` context is NOT available in a
    # step-level `if:` — using it there is not a no-op, it makes the whole
    # workflow file invalid, and GitHub then fails every run at 0s without ever
    # starting a step. Lifting the secret into `env` here is what lets the
    # `if:` below actually evaluate. Same fix as attest-anchors.yml.
    env:
      SIGNER_SECRET: ${{ secrets.CORRIDOR_SIGNER_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The values below are PUBLIC (the SDF test anchor) and are documented in
      # .env.example. Defaulting to them means the probe actually probes on every
      # run instead of self-skipping — this job passed green for months while
      # executing nothing, which is worse than no job at all because it looked
      # like evidence. Only CORRIDOR_SIGNER_SECRET is a real secret; without it
      # the auth-dependent legs skip and the step below says so out loud.
      - run: pnpm exec vitest run tests/integration/sep31-live.test.ts
        env:
          # Known-good public values for every var here (SDF test anchor) are
          # documented in .env.example; only CORRIDOR_SIGNER_SECRET is sensitive.
          ANCHOR_HOME_DOMAIN: ${{ secrets.ANCHOR_HOME_DOMAIN || 'testanchor.stellar.org' }}
          ANCHOR_SEP31_TRANSFER_SERVER: ${{ secrets.ANCHOR_SEP31_TRANSFER_SERVER || 'https://testanchor.stellar.org/sep31' }}
          ANCHOR_SEP31_QUOTE_SERVER: ${{ secrets.ANCHOR_SEP31_QUOTE_SERVER || 'https://testanchor.stellar.org/sep38' }}
          ANCHOR_SEP31_WEB_AUTH: ${{ secrets.ANCHOR_SEP31_WEB_AUTH || 'https://testanchor.stellar.org/auth' }}
          ANCHOR_SEP31_KYC_SERVER: ${{ secrets.ANCHOR_SEP31_KYC_SERVER || 'https://testanchor.stellar.org/sep12' }}
          ANCHOR_ASSET_ISSUER: ${{ secrets.ANCHOR_ASSET_ISSUER || 'GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5' }}
          ANCHOR_DEST_ASSET: ${{ secrets.ANCHOR_DEST_ASSET || 'iso4217:USD' }}
          CORRIDOR_SIGNER_SECRET: ${{ env.SIGNER_SECRET }}

      - name: Warn when the auth-dependent legs could not run
        if: ${{ env.SIGNER_SECRET == '' }}
        run: |
          echo "::warning::CORRIDOR_SIGNER_SECRET is not set, so the SEP-10 and" \
               "SEP-12 legs were skipped. This run verified less than it looks like."
