name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job only; no PR comments, so the token needs no write scope.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # The Soroban contracts are a separate toolchain from the TypeScript monorepo,
  # so they get their own job: fmt, clippy-as-errors, the full test suite, and a
  # real wasm build. The wasm build matters — a contract that compiles natively
  # can still fail to link for wasm32 (two contracts exporting __constructor, for
  # one), and that only shows up here.
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32v1-none

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version comes from package.json "packageManager" (pnpm@9.x); do not also
      # pass `version:` here or action-setup errors on the duplicate.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every library package builds to dist/ with type declarations, passes publint and
      # are-the-types-wrong, and the built output works from a plain Node ESM script.
      - run: pnpm build
      - run: pnpm check:packages
      # The service's OpenAPI 3.1 document must be valid. (tests/openapi.test.ts checks it
      # against the real route(); this checks it against the OpenAPI specification.)
      - run: pnpm --package=@redocly/cli@1.34.5 dlx redocly lint packages/service/openapi.yaml
      # The suite, with coverage thresholds enforced (vitest.config.ts).
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore
      # web/ renders corridor data and the state list generated from the
      # manifests and the engine. Fail when the committed copy has drifted.
      - name: Check web/lib/generated is up to date
        run: |
          pnpm gen:web-data
          git diff --exit-code web/lib/generated || {
            echo "::error::web/lib/generated is stale. Run 'pnpm gen:web-data' and commit the result."
            exit 1
          }

  # Flaky-test quarantine (tests/helpers/quarantine.ts). Runs only the blocks
  # tagged with quarantine(), each retried up to 3 times. Non-blocking by
  # design: a flake must not redden main. It is not silent either: the job
  # summary lists every quarantined test, its tracking issue, and how it did.
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:quarantine --reporter=default --reporter=json --outputFile.json=quarantine-report.json
      - name: Summarize quarantined tests
        if: ${{ always() }}
        run: pnpm exec tsx scripts/quarantine-summary.ts quarantine-report.json >> "$GITHUB_STEP_SUMMARY"

  # Exercises PostgresIdempotencyStore against a real Postgres (the atomic claim
  # + version-guarded upsert that guard against double-settlement), and
  # PostgresAuditSink (ordered, duplicate-free, append-only). The tests are
  # env-gated, so it only runs when CORRIDOR_TEST_DATABASE_URL points at the
  # service container below; the default `pnpm test` job above skips it.
  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: corridor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORRIDOR_TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/corridor_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --no-file-parallelism tests/integration/idempotency-pg.test.ts tests/integration/audit-pg.test.ts

  integration-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORRIDOR_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --no-file-parallelism tests/integration/redis-rate-limiter.test.ts

  # Builds the service image (no push) and smoke-tests the container: non-root, no
  # .env baked in, /healthz answers. Publishing is docker-publish.yml, on tags.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: corridor-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke.sh corridor-service:ci

  # The web/ showcase app is a standalone Next.js project with its own lockfile
  # (intentionally outside the pnpm workspace, see web/README.md), so it gets its
  # own job rather than riding the monorepo gate above.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version resolves from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-workspace: web/ is configured as its own independent pnpm workspace
      # root (web/pnpm-workspace.yaml, #80), so pnpm must treat it as a standalone
      # project rather than resolving the repository root workspace.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
